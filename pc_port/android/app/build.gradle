plugins {
    id "com.android.application"
}

android {
    namespace "com.slickamogus.silenthill"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.slickamogus.silenthill"
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName "0.1.5-rgba-vram-fix"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DSH_BUILD_MAP_DLLS=ON",
                          "-DSH_FMV_FFMPEG=OFF"
                cppFlags "-std=c++17"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            // SDL2 supplies SDLActivity and its Java support classes.
            java.srcDirs += ["../vendor/SDL/android-project/app/src/main/java"]
        }
    }

    packaging {
        jniLibs {
            // Map overlays are opened by soname at runtime; extracting native
            // libraries gives Android's dynamic linker a stable search path.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

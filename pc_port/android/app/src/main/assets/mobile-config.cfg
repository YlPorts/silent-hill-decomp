# Silent Hill Android defaults. The launcher copies this file to the app's
# private storage on first run; existing installations are normalized too.
window_width = 1280
window_height = 720
fullscreen = 2
refresh_rate = 0
vsync = 1
show_console = 0
enable_debug_log = 1
fps_cap = 30

# Base renderer compatibility profile.
msaa = 0
msaa_samples = 0
# Mode 2 keeps the original 4:3 camera/geometry but stretches presentation to
# the full Android surface. Hor+ exposed/cut unauthored scene edges on mobile.
widescreen_mode = 2
menu_pillarbox = 0
menu_filter = 0
psx_dither = 0
use_pgxp = 0
post_process = 0
post_process_intensity = 0.0
tonemap = 0
tonemap_intensity = 0.0
brightness = 1.0
contrast = 1.0
saturation = 1.0
flashlight_mode = 0

# Force a basic stereo endpoint while Android audio output is stabilized.
audio_output = 1

# Keep RAM/GPU use close to the original game while Android is stabilized.
global_chara_pool = 0
resident_textures = 0
preload_chunks = 0
whole_map_exteriors = 0
texture_packs = 0
texpack_cache_mb = 0
texpack_budget_mb = 0

allow_debug_controls = 0
allow_loose_files = 0

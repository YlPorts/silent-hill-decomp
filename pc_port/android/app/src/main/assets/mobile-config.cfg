# Silent Hill Android defaults. The launcher copies this file to the app's
# private storage on first run; in-game changes are then saved to that copy.
window_width = 1280
window_height = 720
fullscreen = 2
refresh_rate = 0
vsync = 1
show_console = 0
enable_debug_log = 1
msaa_samples = 0
widescreen_mode = 1
menu_pillarbox = 1
use_pgxp = 0
post_process = 0
tonemap = 0
flashlight_mode = 0
allow_debug_controls = 0
# Keep the first mobile boot light. Loading every character globally can consume
# a large amount of RAM before the title screen appears on mid-range phones.
global_chara_pool = 0
texture_packs = 0
allow_loose_files = 0

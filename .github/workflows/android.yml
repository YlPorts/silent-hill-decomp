name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/include/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: build-${{ matrix.artifact_label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            version_code: 10
            version_name: 0.1.9-arm64-psx32
            artifact_label: arm64-psx32
          - abi: armeabi-v7a
            version_code: 11
            version_name: 0.1.9-armv7-psx32
            artifact_label: armv7-psx32

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Validate Android patch scripts
        run: |
          python3 -m py_compile pc_port/android/scripts/apply_psycross_android.py
          python3 -m py_compile pc_port/android/scripts/patch_first_frame_android.py
          python3 -m py_compile pc_port/android/scripts/patch_android_gles_ot.py
          python3 -m py_compile pc_port/android/scripts/patch_android_psx_word_types.py
          python3 -m py_compile pc_port/android/scripts/configure_android_variant.py
          python3 -m py_compile pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Apply Android native startup fixes
        run: python3 pc_port/android/scripts/apply_psycross_android.py

      - name: Apply Android first-frame diagnostics
        run: python3 pc_port/android/scripts/patch_first_frame_android.py

      - name: Apply Android RGBA VRAM foundation
        run: python3 pc_port/android/scripts/patch_android_gles_ot.py

      - name: Force fixed-width PlayStation words
        run: python3 pc_port/android/scripts/patch_android_psx_word_types.py

      - name: Configure ${{ matrix.artifact_label }} variant
        run: |
          python3 pc_port/android/scripts/configure_android_variant.py \
            --abi "${{ matrix.abi }}" \
            --version-code "${{ matrix.version_code }}" \
            --version-name "${{ matrix.version_name }}"

      - name: Prepare isolated-process crash diagnostics
        run: python3 pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Verify clean PSX32 variant
        run: |
          grep -F 'android:process=":game"' pc_port/android/app/src/main/AndroidManifest.xml
          grep -F 'versionName "${{ matrix.version_name }}"' pc_port/android/app/build.gradle
          grep -F 'abiFilters "${{ matrix.abi }}"' pc_port/android/app/build.gradle
          grep -F 'typedef uint32_t u_long;' pc_port/PsyCross/include/psx/types.h
          grep -F 'typedef uint32_t ulong;' pc_port/PsyCross/include/psx/types.h
          grep -F 'PSYX_ANDROID_PSX_ULONG_32' pc_port/PsyCross/include/psx/types.h
          grep -F 'Android PSX u_long must be 32-bit' pc_port/PsyCross/include/psx/types.h
          grep -F 'GL_RGBA8' pc_port/PsyCross/include/PsyX/PsyX_render.h
          grep -F 'Versión: ' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          ! grep -F 'VRAMBytesAt' pc_port/PsyCross/src/render/PsyX_render.cpp
          ! grep -F 'AndroidPointerReadable' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'GTE_ANDROID_VERTEX_COLOR' pc_port/PsyCross/src/render/PsyX_render.cpp
          ! grep -F 'OT_INVALID_NEXT' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_PARSE_OT")' pc_port/src/stubs/libgs_stub.c
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_DEPTH_CLEAR")' pc_port/src/stubs/libgs_stub.c
          python3 - <<'PY'
          from pathlib import Path
          launcher = Path("pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java").read_text(encoding="utf-8")
          good = r"PlayStation.\nVersión: "
          bad = "PlayStation.\nVersión: "
          if good not in launcher:
              raise SystemExit("generated launcher is missing the escaped version newline")
          if bad in launcher:
              raise SystemExit("generated launcher contains an illegal literal newline inside the Java string")
          PY

      - name: Build clean ${{ matrix.artifact_label }} APK
        working-directory: pc_port/android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain clean :app:assembleDebug > android-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; final diagnostic lines follow:"
            tail -n 300 android-build.log
          fi
          exit "$status"

      - name: Upload ${{ matrix.artifact_label }} build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-build-log-${{ matrix.artifact_label }}-${{ github.sha }}
          path: pc_port/android/android-build.log
          if-no-files-found: warn

      - name: Upload ${{ matrix.artifact_label }} APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-${{ matrix.artifact_label }}-${{ github.sha }}
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/include/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7-color-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Validate focused Android patch scripts
        run: |
          python3 -m py_compile pc_port/android/scripts/apply_psycross_android.py
          python3 -m py_compile pc_port/android/scripts/patch_first_frame_android.py
          python3 -m py_compile pc_port/android/scripts/patch_android_gles_ot.py
          python3 -m py_compile pc_port/android/scripts/patch_android_exact_indexed.py
          python3 -m py_compile pc_port/android/scripts/configure_android_variant.py
          python3 -m py_compile pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Apply Android native startup fixes
        run: python3 pc_port/android/scripts/apply_psycross_android.py

      - name: Apply Android first-frame diagnostics
        run: python3 pc_port/android/scripts/patch_first_frame_android.py

      - name: Apply Android RGBA VRAM foundation
        run: python3 pc_port/android/scripts/patch_android_gles_ot.py

      - name: Apply exact Android indexed texture colors
        run: python3 pc_port/android/scripts/patch_android_exact_indexed.py

      - name: Configure ARMv7 color-fix build
        run: |
          python3 pc_port/android/scripts/configure_android_variant.py \
            --abi "armeabi-v7a" \
            --version-code "14" \
            --version-name "0.2.0-armv7-colorfix"

      - name: Prepare isolated-process crash diagnostics
        run: python3 pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Verify focused ARMv7 color fix
        run: |
          grep -F 'android:process=":game"' pc_port/android/app/src/main/AndroidManifest.xml
          grep -F 'versionName "0.2.0-armv7-colorfix"' pc_port/android/app/build.gradle
          grep -F 'abiFilters "armeabi-v7a"' pc_port/android/app/build.gradle
          grep -F 'const unsigned char high = (unsigned char)(word >> 8);' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'dst[i * 4 + 2] = high;' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'dst[i * 4 + 3] = high;' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'ivec2 VRAMBytesAt(vec2 pixel)' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'texelFetch(s_texture, p, 0)' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'ANDROID_EXACT_GPU_SAMPLE_TEXTURE_4BIT_FUNC' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'ANDROID_EXACT_GPU_SAMPLE_TEXTURE_8BIT_FUNC' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'ANDROID_EXACT_GPU_SAMPLE_TEXTURE_16BIT_FUNC' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'glColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE)' pc_port/PsyCross/src/render/PsyX_render.cpp
          ! grep -F 'AndroidPointerReadable' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'OT_INVALID_NEXT' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'GTE_ANDROID_VERTEX_COLOR' pc_port/PsyCross/src/render/PsyX_render.cpp
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_PARSE_OT")' pc_port/src/stubs/libgs_stub.c
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_DEPTH_CLEAR")' pc_port/src/stubs/libgs_stub.c

      - name: Build clean ARMv7 color-fix APK
        working-directory: pc_port/android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain clean :app:assembleDebug > android-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; final diagnostic lines follow:"
            tail -n 350 android-build.log
          fi
          exit "$status"

      - name: Upload ARMv7 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-build-log-armv7-colorfix-${{ github.sha }}
          path: pc_port/android/android-build.log
          if-no-files-found: warn

      - name: Upload ARMv7 color-fix APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-armv7-colorfix-${{ github.sha }}
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

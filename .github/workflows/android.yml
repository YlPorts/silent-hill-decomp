name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/include/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Validate Android patch scripts
        run: |
          python3 -m py_compile pc_port/android/scripts/apply_psycross_android.py
          python3 -m py_compile pc_port/android/scripts/patch_first_frame_android.py
          python3 -m py_compile pc_port/android/scripts/patch_android_gles_ot.py
          python3 -m py_compile pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Apply Android native startup fixes
        run: python3 pc_port/android/scripts/apply_psycross_android.py

      - name: Apply Android first-frame diagnostics
        run: python3 pc_port/android/scripts/patch_first_frame_android.py

      - name: Apply Android GLES ordering-table fix
        run: python3 pc_port/android/scripts/patch_android_gles_ot.py

      - name: Prepare isolated-process crash diagnostics
        run: python3 pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Verify Android GLES renderer fix
        run: |
          grep -F 'android:process=":game"' pc_port/android/app/src/main/AndroidManifest.xml
          grep -F 'versionName "0.1.3-gles-ot-fix"' pc_port/android/app/build.gradle
          grep -F '#include <GLES3/gl3.h>' pc_port/src/stubs/libgs_stub.c
          grep -F 'glClearDepthf(1.0f);' pc_port/src/stubs/libgs_stub.c
          grep -F 'FIRST_FRAME_DEPTH_CLEAR' pc_port/src/stubs/libgs_stub.c
          grep -F 'FIRST_FRAME_PARSE_OT' pc_port/src/stubs/libgs_stub.c
          grep -F 'FIRST_FRAME_PRESENTED' src/bodyprog/sys/game_main.c
          grep -F 'CRASH_SIGSEGV' pc_port/src/main_pc.c
          grep -F 'El juego no completó el arranque' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          ! grep -F 'launchMarkerFile().delete();' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java

      - name: Build clean ARM64 GLES ordering-table fix APK
        working-directory: pc_port/android
        run: gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Upload GLES ordering-table fix APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-gles-ot-fix-${{ github.sha }}
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

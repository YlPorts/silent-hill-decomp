name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/include/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7-runtime-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Validate Android patch scripts
        run: |
          python3 -m py_compile pc_port/android/scripts/apply_psycross_android.py
          python3 -m py_compile pc_port/android/scripts/patch_first_frame_android.py
          python3 -m py_compile pc_port/android/scripts/patch_android_gles_ot.py
          python3 -m py_compile pc_port/android/scripts/patch_android_exact_indexed.py
          python3 -m py_compile pc_port/android/scripts/patch_android_armv7_runtime.py
          python3 -m py_compile pc_port/android/scripts/configure_android_variant.py
          python3 -m py_compile pc_port/android/scripts/prepare_launcher_diagnostics.py
          python3 -m py_compile pc_port/android/scripts/patch_launcher_runtime_defaults.py

      - name: Apply Android native startup fixes
        run: python3 pc_port/android/scripts/apply_psycross_android.py

      - name: Apply Android first-frame diagnostics
        run: python3 pc_port/android/scripts/patch_first_frame_android.py

      - name: Apply Android RGBA VRAM foundation
        run: python3 pc_port/android/scripts/patch_android_gles_ot.py

      - name: Apply exact indexed texture colors
        run: python3 pc_port/android/scripts/patch_android_exact_indexed.py

      - name: Apply drawable, offscreen, geometry and audio fixes
        run: python3 pc_port/android/scripts/patch_android_armv7_runtime.py

      - name: Configure ARMv7 runtime-fix build
        run: |
          python3 pc_port/android/scripts/configure_android_variant.py \
            --abi "armeabi-v7a" \
            --version-code "15" \
            --version-name "0.2.1-armv7-runtimefix"

      - name: Prepare isolated-process diagnostics
        run: python3 pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Normalize existing-install display and audio settings
        run: python3 pc_port/android/scripts/patch_launcher_runtime_defaults.py

      - name: Verify focused ARMv7 runtime fix
        run: |
          grep -F 'android:process=":game"' pc_port/android/app/src/main/AndroidManifest.xml
          grep -F 'versionName "0.2.1-armv7-runtimefix"' pc_port/android/app/build.gradle
          grep -F 'abiFilters "armeabi-v7a"' pc_port/android/app/build.gradle
          grep -F 'GR_RefreshAndroidDrawableSize' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'SDL_GL_GetDrawableSize' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'ANDROID_SYNC_OFFSCREEN_PACK' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'const u_char* rgba = (const u_char*)&c;' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'GR_DirectUploadVRAMRegion(g_PreviousOffscreen.x' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'extern "C" { int g_PsxPolySizeCull = 0; }' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          grep -F 'Android: opening default OpenAL output device' pc_port/PsyCross/src/audio/PsyX_SPUAL.cpp
          grep -F 'attrs[n++] = 48000;' pc_port/PsyCross/src/audio/PsyX_SPUAL.cpp
          grep -F '{"widescreen_mode", "2"}' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          grep -F '{"menu_pillarbox", "0"}' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          grep -F '{"audio_output", "1"}' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          grep -F 'widescreen_mode = 2' pc_port/android/app/src/main/assets/mobile-config.cfg
          grep -F 'audio_output = 1' pc_port/android/app/src/main/assets/mobile-config.cfg
          ! grep -F 'AndroidPointerReadable' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'OT_INVALID_NEXT' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 'GTE_ANDROID_VERTEX_COLOR' pc_port/PsyCross/src/render/PsyX_render.cpp
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_PARSE_OT")' pc_port/src/stubs/libgs_stub.c
          ! grep -F 'PcPort_WriteStartupStatus("FIRST_FRAME_DEPTH_CLEAR")' pc_port/src/stubs/libgs_stub.c

      - name: Build clean ARMv7 runtime-fix APK
        working-directory: pc_port/android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain clean :app:assembleDebug > android-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; final diagnostic lines follow:"
            tail -n 400 android-build.log
          fi
          exit "$status"

      - name: Upload ARMv7 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-build-log-armv7-runtimefix-${{ github.sha }}
          path: pc_port/android/android-build.log
          if-no-files-found: warn

      - name: Upload ARMv7 runtime-fix APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-armv7-runtimefix-${{ github.sha }}
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

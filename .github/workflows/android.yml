name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/include/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Validate Android patch scripts
        run: |
          python3 -m py_compile pc_port/android/scripts/apply_psycross_android.py
          python3 -m py_compile pc_port/android/scripts/patch_first_frame_android.py
          python3 -m py_compile pc_port/android/scripts/patch_android_gles_ot.py
          python3 -m py_compile pc_port/android/scripts/patch_android_runtime_guard.py
          python3 -m py_compile pc_port/android/scripts/patch_android_runtime_guard_v2.py
          python3 -m py_compile pc_port/android/scripts/patch_android_realtime_ot_color.py
          python3 -m py_compile pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Apply Android native startup fixes
        run: python3 pc_port/android/scripts/apply_psycross_android.py

      - name: Apply Android first-frame diagnostics
        run: python3 pc_port/android/scripts/patch_first_frame_android.py

      - name: Apply Android RGBA VRAM foundation
        run: python3 pc_port/android/scripts/patch_android_gles_ot.py

      - name: Apply Android channel and OT runtime guards
        run: python3 pc_port/android/scripts/patch_android_runtime_guard_v2.py

      - name: Remove OT diagnostic overhead and neutralize textured lighting
        run: python3 pc_port/android/scripts/patch_android_realtime_ot_color.py

      - name: Prepare isolated-process crash diagnostics
        run: python3 pc_port/android/scripts/prepare_launcher_diagnostics.py

      - name: Verify Android real-time OT and color fallback build
        run: |
          grep -F 'android:process=":game"' pc_port/android/app/src/main/AndroidManifest.xml
          grep -F 'versionName "0.1.7-ot-color-realtime"' pc_port/android/app/build.gradle
          grep -F 'highByte = max(raw.g, max(raw.b, raw.a))' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'Normal rendering must not snprintf' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          grep -F 'return start >= 0x10000ULL' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          grep -F 'GTE_ANDROID_VERTEX_COLOR' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'androidTextured = step(1.5, a_texcoord.z)' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'vec3 androidRgb = mix' pc_port/PsyCross/src/render/PsyX_render.cpp
          grep -F 'resident_textures", "0' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          grep -F 'Versión: ' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          ! grep -F '/proc/self/maps' pc_port/PsyCross/src/gpu/PsyX_GPU.cpp
          ! grep -F 's_androidFirstOtTrace = 0' pc_port/PsyCross/src/psx/libgpu.c
          ! grep -F 'launchMarkerFile().delete();' pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java
          python3 - <<'PY'
          from pathlib import Path
          launcher = Path("pc_port/android/app/src/main/java/com/slickamogus/silenthill/LauncherActivity.java").read_text(encoding="utf-8")
          shader = Path("pc_port/PsyCross/src/render/PsyX_render.cpp").read_text(encoding="utf-8")
          good = r"PlayStation.\nVersión: "
          bad = "PlayStation.\nVersión: "
          if good not in launcher:
              raise SystemExit("generated launcher is missing the escaped version newline")
          if bad in launcher:
              raise SystemExit("generated launcher contains an illegal literal newline inside the Java string")
          if shader.count("\tGTE_ANDROID_VERTEX_COLOR\\") != 1:
              raise SystemExit("Android vertex-color compatibility macro is not used exactly once")
          PY

      - name: Build clean ARM64 real-time OT and color APK
        working-directory: pc_port/android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain clean :app:assembleDebug > android-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Gradle failed; final diagnostic lines follow:"
            tail -n 250 android-build.log
          fi
          exit "$status"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-build-log-${{ github.sha }}
          path: pc_port/android/android-build.log
          if-no-files-found: warn

      - name: Upload Android real-time OT and color APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-ot-color-realtime-${{ github.sha }}
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

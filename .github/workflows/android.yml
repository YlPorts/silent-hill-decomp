name: Android native port

on:
  push:
    branches:
      - codex/android-port-foundation
    paths:
      - "pc_port/android/**"
      - "pc_port/src/**"
      - "pc_port/maps/**"
      - "pc_port/CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check out pinned native dependencies
        run: git submodule update --init --recursive

      - name: Apply Android PsyCross compatibility patch
        run: git -C pc_port/PsyCross apply --ignore-space-change --ignore-whitespace ../android/patches/psycross-android.patch

      - name: Build ARM64 debug APK
        working-directory: pc_port/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: silent-hill-android-debug
          path: pc_port/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
